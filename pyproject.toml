[project]
name = "qtrader"
version = "0.1.0"
description = "Plataforma experimental de gestión cuantitativa de cartera (solo simulación)"
requires-python = "==3.12.*"
dependencies = [
    "exchange-calendars>=4.13.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
qtrader = "qtrader.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pydantic>=2.0,<3",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
    "import-linter>=2.13",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow-stubs>=20.0.0.20260625",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrader"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["qtrader"]

[[tool.importlinter.contracts]]
name = "data layer does not import execution or agents"
type = "forbidden"
source_modules = ["qtrader.data"]
forbidden_modules = ["qtrader.execution", "qtrader.agents"]

[[tool.importlinter.contracts]]
name = "risk does not import outside core"
type = "forbidden"
source_modules = ["qtrader.risk"]
forbidden_modules = [
    "qtrader.data",
    "qtrader.brokers",
    "qtrader.ledger",
    "qtrader.strategies",
    "qtrader.execution",
    "qtrader.agents",
]

[[tool.importlinter.contracts]]
name = "strategies does not import execution"
type = "forbidden"
source_modules = ["qtrader.strategies"]
forbidden_modules = ["qtrader.execution", "qtrader.agents"]

[[tool.importlinter.contracts]]
name = "validation does not import ledger or execution"
type = "forbidden"
source_modules = ["qtrader.data.validation"]
forbidden_modules = ["qtrader.ledger", "qtrader.execution", "qtrader.agents"]

[[tool.importlinter.contracts]]
name = "backtesting does not import agents or real brokers"
type = "forbidden"
source_modules = ["qtrader.backtesting"]
forbidden_modules = ["qtrader.agents", "qtrader.brokers"]

[[tool.importlinter.contracts]]
name = "costs module does not import execution agents or brokers"
type = "forbidden"
source_modules = ["qtrader.costs"]
forbidden_modules = ["qtrader.agents", "qtrader.brokers", "qtrader.execution", "qtrader.ledger"]

[[tool.importlinter.contracts]]
name = "research does not import agents or real brokers"
type = "forbidden"
source_modules = ["qtrader.research"]
forbidden_modules = ["qtrader.agents", "qtrader.brokers"]

[[tool.importlinter.contracts]]
name = "strategies does not import brokers or agents"
type = "forbidden"
source_modules = ["qtrader.strategies"]
forbidden_modules = ["qtrader.brokers", "qtrader.agents", "qtrader.execution"]
