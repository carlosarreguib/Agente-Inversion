[project]
name = "qtrader"
version = "0.1.0"
description = "Plataforma experimental de gestión cuantitativa de cartera (solo simulación)"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pydantic>=2.0,<3",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrader"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
